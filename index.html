  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f0f2f5 0%, #e6e9ef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: space-around;
      max-width: 1200px;
      width: 100%;
      flex-wrap: wrap;
      gap: 40px;
    }

    .left-side {
      max-width: 500px;
      text-align: right;
      color: #afd116;
    }

    .logo {
      width: 280px;
      margin-bottom: 20px;
      color: #28a745;
    }

    .left-side h1 {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #1a3b7c;
    }

    .left-side p {
      font-size: 24px;
      line-height: 1.5;
      color: #333;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-card h2 {
      color: #17b847;
      margin-bottom: 30px;
      font-size: 26px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border: 2px solid #0e77ee;
      border-radius: 8px;
      font-size: 17px;
      direction: rtl;
    }

    .login-btn {
      background-color: #e09f26;
      color: white;
      padding: 16px;
      border: none;
      border-radius: 8px;
      width: 100%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .login-btn:hover {
      background-color: #0f2656;
    }

    .forgot {
      display: block;
      margin: 20px 0;
      color: #1a3b7c;
      text-decoration: none;
      font-size: 15px;
    }

    .register-btn {
      background-color: #a72876;
      color: white;
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background-color: #218838;
    }

    .footer {
      margin-top: 50px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    /* للموبايل */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      .left-side h1 {
        font-size: 36px;
      }
      .left-side p {
        font-size: 20px;
      }
      .logo {
        width: 220px;
      }
    }
  </style>
</head>
